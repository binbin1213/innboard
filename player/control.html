<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline';" />
  <title>房价牌播放器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #D8B56A;
      --gold-deep: rgba(216, 181, 106, 0.75);
      --line: rgba(255, 255, 255, 0.09);
      --text: #ECE9E2;
      --muted: #8B909B;
    }
    html, body { height: 100%; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(168deg, #0C1220 0%, #070B14 55%, #0A0F1A 100%);
      color: var(--text);
      padding: 20px 20px 16px;
      height: 100vh;
      overflow-y: auto;
      -webkit-user-select: none;
      user-select: none;
    }
    .title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .title::before {
      content: "";
      width: 4px;
      height: 17px;
      border-radius: 2px;
      background: linear-gradient(var(--gold), rgba(216, 181, 106, 0.25));
    }
    .sub {
      color: var(--muted);
      font-size: 12px;
      margin: 5px 0 16px 14px;
    }
    .card {
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 13px 14px;
      margin-bottom: 12px;
    }
    .label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    .row { display: flex; gap: 8px; }
    input {
      flex: 1;
      min-width: 0;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
    }
    input:focus { border-color: var(--gold-deep); }
    button {
      border: 1px solid transparent;
      border-radius: 9px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      transition: filter 0.15s ease, transform 0.05s ease;
    }
    button:active { transform: scale(0.98); }
    .btn-primary {
      background: linear-gradient(160deg, #E8CA79, #C49B4A);
      color: #1C1406;
      font-weight: 700;
    }
    .btn-primary:hover { filter: brightness(1.07); }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--line);
      color: var(--text);
    }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.1); }
    .btn-danger {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 120, 120, 0.25);
      color: #F0B6B6;
    }
    .btn-danger:hover { background: rgba(255, 120, 120, 0.1); }
    .btn-block { width: 100%; padding: 10px 0; }
    .btn-half {
      flex: 1;
      padding: 11px 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-half svg { flex-shrink: 0; }
    .pair { display: flex; gap: 10px; }
    .hint {
      color: var(--muted);
      font-size: 11.5px;
      margin-top: 8px;
      line-height: 1.6;
    }
    .status {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.8;
      border-left: 2px solid var(--gold-deep);
      padding-left: 10px;
      min-height: 20px;
      word-break: break-all;
    }
    .status b { color: var(--gold); font-weight: 600; }
  </style>
</head>
<body>
  <div class="title">房价牌播放器</div>
  <div class="sub">酒店智能房价牌 · 电视竖屏展示端</div>

  <div class="card">
    <label class="label">服务器地址</label>
    <div class="row">
      <input id="url" type="text" placeholder="https://hotel.binbino.cn" />
      <button class="btn-ghost" id="save" style="padding:0 14px;">保存</button>
    </div>
    <div class="hint">修改房价 / 图片 / 公告，请点下方「打开管理后台」。</div>
  </div>

  <div class="card">
    <label class="label">电视播放</label>
    <div class="pair">
      <button class="btn-primary btn-half" id="play">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M8 5.14v13.72a1 1 0 0 0 1.53.85l10.99-6.86a1 1 0 0 0 0-1.7L9.53 4.29A1 1 0 0 0 8 5.14z" />
        </svg>
        播放
      </button>
      <button class="btn-danger btn-half" id="stop">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="6" y="6" width="12" height="12" rx="1.5" />
        </svg>
        停止
      </button>
    </div>
    <button class="btn-ghost btn-block" id="refresh" style="margin-top:10px;">刷新画面</button>
  </div>

  <div class="card">
    <label class="label">本地备份</label>
    <div class="pair">
      <button class="btn-ghost btn-half" id="cache">手动缓存</button>
      <button class="btn-ghost btn-half" id="local">本地模式</button>
    </div>
    <div class="hint">连网时先「手动缓存」存一份完整页面；断网时「本地模式」在电视上显示它。</div>
  </div>

  <div class="card">
    <button class="btn-primary btn-block" id="admin">打开管理后台</button>
  </div>

  <div class="card">
    <label class="label">状态</label>
    <div class="status" id="status">正在检测屏幕…</div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const $url = document.getElementById('url');
    const $save = document.getElementById('save');
    const $play = document.getElementById('play');
    const $stop = document.getElementById('stop');
    const $refresh = document.getElementById('refresh');
    const $local = document.getElementById('local');
    const $cache = document.getElementById('cache');
    const $admin = document.getElementById('admin');
    const $status = document.getElementById('status');

    function setStatus(html) {
      $status.innerHTML = html;
    }

    async function refreshDisplays() {
      try {
        const displays = await ipcRenderer.invoke('get-displays');
        const primary = displays.find((d) => d.primary);
        const others = displays.filter((d) => !d.primary);
        let html = `共检测到 <b>${displays.length}</b> 块屏幕<br>`;
        if (others.length > 0) {
          const tv = others[0];
          html += `将在第 2 块屏（<b>${tv.width}×${tv.height}</b>）全屏播放`;
        } else {
          html += '只检测到一块屏幕，将直接全屏播放（请确认 HDMI 电视已连接并设为竖屏）';
        }
        setStatus(html);
      } catch (e) {
        setStatus('无法读取屏幕信息');
      }
    }

    async function init() {
      const cfg = await ipcRenderer.invoke('get-config');
      $url.value = cfg.serverUrl || '';
      await refreshDisplays();
    }

    $save.addEventListener('click', async () => {
      const r = await ipcRenderer.invoke('save-config', { serverUrl: $url.value.trim() });
      setStatus(r.ok ? '地址已保存' : '保存失败');
    });

    $play.addEventListener('click', async () => {
      const r = await ipcRenderer.invoke('play');
      if (r && r.ok) {
        setStatus(`正在电视全屏播放<br>地址：<b>${r.url}</b>`);
      } else {
        setStatus(`播放失败：${(r && r.msg) || '未知错误'}`);
      }
    });

    $stop.addEventListener('click', async () => {
      await ipcRenderer.invoke('stop');
      setStatus('已停止播放');
    });

    $refresh.addEventListener('click', async () => {
      const r = await ipcRenderer.invoke('refresh');
      setStatus(r.ok ? '已刷新电视画面' : `刷新失败：${(r && r.msg) || '未知错误'}`);
    });

    $local.addEventListener('click', async () => {
      const r = await ipcRenderer.invoke('local-mode');
      setStatus(r.ok ? '已切换到本地模式' : `切换失败：${(r && r.msg) || '未知错误'}`);
    });

    $cache.addEventListener('click', async () => {
      setStatus('正在下载缓存…');
      const r = await ipcRenderer.invoke('cache-snapshot');
      setStatus(r.ok ? '缓存成功！已保存完整页面' : `缓存失败：${(r && r.msg) || '未知错误'}`);
    });

    $admin.addEventListener('click', async () => {
      const r = await ipcRenderer.invoke('open-admin');
      if (r && !r.ok) setStatus(`无法打开管理后台：${r.msg || '未知错误'}`);
    });

    init();
  </script>
</body>
</html>
