<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>待机</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: linear-gradient(160deg, #020B18 0%, #061B34 60%, #020B18 100%);
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* 金色呼吸圆点：无任何文字，客人只会看到类似屏保的画面 */
    .pulse {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #D8B56A;
      box-shadow: 0 0 24px rgba(216, 181, 106, 0.55);
      animation: breathe 2.6s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.12; transform: scale(0.75); }
      50% { opacity: 0.75; transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div class="pulse"></div>
  <script>
    // 静默自动重连：每 30 秒尝试一次，服务器恢复后自动恢复显示，无需人工干预
    const params = new URLSearchParams(location.search);
    const url = params.get('url') || '';
    if (url) setInterval(() => { location.href = url; }, 30000);
  </script>
</body>
</html>
