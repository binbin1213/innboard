<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>无法连接服务器</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0c0c0c;
      color: #f2efe6;
      font-family: "Microsoft YaHei", sans-serif;
    }
    .box { text-align: center; padding: 40px; }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h2 { font-size: 22px; font-weight: 600; margin: 0 0 10px; }
    p { color: #9a968c; font-size: 14px; margin: 0 0 24px; line-height: 1.8; }
    button {
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 16px;
      cursor: pointer;
      background: linear-gradient(160deg, #e8c96a, #8a7330);
      color: #1a1405;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h2>无法连接服务器</h2>
    <p>请检查网络，以及播放器里填写的服务器地址是否正确。</p>
    <button id="retry">重新连接</button>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const url = params.get('url') || '';
    document.getElementById('retry').addEventListener('click', () => {
      if (url) location.href = url;
      else location.reload();
    });
  </script>
</body>
</html>
